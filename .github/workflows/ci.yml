name: CI

on:
  push:
    branches: [main, dev, "feature/**", "fix/**", "docs/**"]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Lint and test scripts are added by the frontend owner; --if-present keeps CI green until then.
      - run: npm run lint --if-present
      - run: npm test --if-present
      - run: npm run build

  backend:
    name: Backend (ruff, pytest, no TensorFlow)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # requirements-dev.txt must NOT include tensorflow: tests use a fake model service.
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
